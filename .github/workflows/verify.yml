name: LongHorn verification
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:rust-service
      - run: pnpm build:rust-reports
      - run: node scripts/verify-rust-reports.mjs
      - run: node scripts/verify-owned-native-reports.mjs
  d1-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-d1.mjs
      - run: node scripts/verify-d1-idempotency.mjs
      - run: node scripts/verify-d1-rate-limits.mjs
      - run: node scripts/verify-d1-project.mjs
      - name: Retain D1 request limit proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-request-limit-proof
          path: |
            .artifacts/d1-rate-limit-proof.json
            .artifacts/d1-rate-limit-project-proof.json
          if-no-files-found: error
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-otlp.mjs
      - run: node scripts/verify-otlp-metrics.mjs
      - run: node scripts/verify-otlp-logs.mjs
  redis-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-cache.mjs
      - run: node scripts/verify-redis-cache.mjs
      - run: node scripts/verify-redis-limits.mjs
      - name: Retain Redis request limit proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redis-request-limit-proof
          path: .artifacts/redis-rate-limit-proof.json
          if-no-files-found: error
  source-and-runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tasks
      - run: node scripts/verify-prune-packages.mjs
      - name: Retain packed prune proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prune-package-proof
          path: .artifacts/prune-package-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/verify-object-rate-limits.mjs
      - name: Retain Object request limit proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: object-request-limit-proof
          path: .artifacts/object-rate-limit-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/verify-runtimes.mjs
      - run: node scripts/verify-password-runtimes.mjs
      - run: node scripts/verify-auth.mjs
      - run: node scripts/verify-auth.mjs bun
      - run: node scripts/verify-auth-project.mjs
      - run: node scripts/verify-bun-sqlite.mjs
      - run: node scripts/verify-deno-sqlite.mjs
      - run: node scripts/verify-projects.mjs
      - run: node scripts/verify-sqlite-project.mjs
      - run: node scripts/verify-sqlite-project.mjs bun
      - run: node scripts/verify-sqlite-project.mjs deno
  account-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-command-history.mjs
      - run: node scripts/verify-history-filters.mjs
      - run: node scripts/verify-history-search.mjs
      - run: node scripts/verify-history-views.mjs
      - run: node scripts/verify-request-cleanup.mjs
      - run: node scripts/verify-limit-cleanup.mjs
      - run: node scripts/verify-command-limit-maintenance.mjs
      - name: Retain command budget maintenance proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: command-limit-maintenance-proof
          path: .artifacts/command-limit-maintenance-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain native budget cleanup proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: limit-cleanup-proof
          path: .artifacts/limit-cleanup-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/verify-rate-limits.mjs
      - run: node scripts/verify-command-limits.mjs
      - run: node scripts/verify-operator-accounts.mjs
      - run: node scripts/verify-password-changes.mjs
      - run: node scripts/verify-session-controls.mjs
      - run: node scripts/verify-session-inventory.mjs
      - name: Retain native session inventory proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-inventory-native-proof
          path: .artifacts/session-inventory-native-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/verify-persistent-operations.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - id: verify-console
        run: |
          node scripts/verify-console.mjs
          node scripts/verify-history-search-console.mjs
          node scripts/verify-history-views-console.mjs
          node scripts/verify-history-view-links.mjs
          node scripts/verify-history-export.mjs
          node scripts/verify-audit-export.mjs
          node scripts/verify-receipt-export.mjs
          node scripts/verify-command-follow.mjs
          node scripts/verify-console-account.mjs
          node scripts/verify-session-inventory-console.mjs
          node scripts/verify-history-live.mjs
      - name: Retain console review captures
        id: console-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longhorn-console-${{ github.run_id }}
          path: |
            .artifacts/console/**/*.png
            .artifacts/console/**/accessibility.json
            .artifacts/session-inventory-console-proof.json
            .artifacts/history-live-proof.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Report console verification and artifact availability
        if: always()
        run: node scripts/report-ci-artifacts.mjs console '${{ steps.verify-console.outcome }}' '${{ steps.console-artifact.outcome }}' '${{ steps.console-artifact.outputs.artifact-id }}'
  independent-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison flex perl
      - run: node scripts/prepare-postgres-clients.mjs
      - run: pnpm build
      - id: verify-application
        run: |
          node scripts/verify-command-app.mjs
          node scripts/verify-command-project.mjs
      - name: Retain independently verified application
        id: application-artifact
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longhorn-command-app-${{ github.run_id }}
          path: |
            .artifacts/longhorn-command-app.tgz
            .artifacts/longhorn-command-app.tgz.sha256
            .artifacts/longhorn-command-project.tgz
            .artifacts/longhorn-command-project.tgz.sha256
            .artifacts/command-project-proof.json
            .artifacts/session-inventory-distribution-proof-archive.json
            .artifacts/session-inventory-distribution-proof-cli.json
            .artifacts/history-live-distribution-proof-archive.json
            .artifacts/history-live-distribution-proof-cli.json
            .artifacts/command-development-proof.json
            .artifacts/operator-preflight-proof-archive.json
            .artifacts/operator-preflight-proof-cli.json
            .artifacts/rate-limit-proof.json
            .artifacts/command-limit-proof.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Report application verification and artifact availability
        if: always()
        run: node scripts/report-ci-artifacts.mjs application '${{ steps.verify-application.outcome }}' '${{ steps.application-artifact.outcome }}' '${{ steps.application-artifact.outputs.artifact-id }}'
