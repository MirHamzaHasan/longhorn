name: LongHorn verification
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:rust-service
      - run: pnpm build:rust-reports
      - run: node scripts/verify-rust-reports.mjs
      - run: node scripts/verify-owned-native-reports.mjs
  d1-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-d1.mjs
      - run: node scripts/verify-d1-idempotency.mjs
      - run: node scripts/verify-d1-project.mjs
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-otlp.mjs
      - run: node scripts/verify-otlp-metrics.mjs
      - run: node scripts/verify-otlp-logs.mjs
  redis-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-cache.mjs
      - run: node scripts/verify-redis-cache.mjs
  source-and-runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/verify-runtimes.mjs
      - run: node scripts/verify-bun-sqlite.mjs
      - run: node scripts/verify-deno-sqlite.mjs
      - run: node scripts/verify-projects.mjs
      - run: node scripts/verify-sqlite-project.mjs
      - run: node scripts/verify-sqlite-project.mjs bun
  account-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-command-history.mjs
      - run: node scripts/verify-operator-accounts.mjs
      - run: node scripts/verify-persistent-operations.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - id: verify-console
        run: node scripts/verify-console.mjs
      - name: Retain console review captures
        id: console-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longhorn-console-${{ github.run_id }}
          path: |
            .artifacts/console/*.png
            .artifacts/console/accessibility.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Report console verification and artifact availability
        if: always()
        run: node scripts/report-ci-artifacts.mjs console '${{ steps.verify-console.outcome }}' '${{ steps.console-artifact.outcome }}' '${{ steps.console-artifact.outputs.artifact-id }}'
  independent-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.4
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison flex perl
      - run: node scripts/prepare-postgres-clients.mjs
      - run: pnpm build
      - id: verify-application
        run: node scripts/verify-command-app.mjs
      - name: Retain independently verified application
        id: application-artifact
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longhorn-command-app-${{ github.run_id }}
          path: |
            .artifacts/longhorn-command-app.tgz
            .artifacts/longhorn-command-app.tgz.sha256
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Report application verification and artifact availability
        if: always()
        run: node scripts/report-ci-artifacts.mjs application '${{ steps.verify-application.outcome }}' '${{ steps.application-artifact.outcome }}' '${{ steps.application-artifact.outputs.artifact-id }}'
