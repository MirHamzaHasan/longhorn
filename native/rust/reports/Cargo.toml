[package]
name = "longhorn-native-reports"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.51.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"

