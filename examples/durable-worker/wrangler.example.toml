name = "longhorn-durable-reports"
main = "dist/index.js"
compatibility_date = "2025-07-18"

[vars]
REPORT_LIMIT_ENABLED = "false"
REPORT_LIMIT_REQUESTS = "60"
REPORT_LIMIT_WINDOW_MS = "60000"

[durable_objects]
bindings = [{ name = "REPORTS", class_name = "ReportCoordinator" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportCoordinator"]

[triggers]
crons = ["* * * * *"]
